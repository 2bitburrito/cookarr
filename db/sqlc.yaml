version: "2"
sql:
  - engine: sqlite
    schema: ../internal/store/migrations/sqlite
    queries: queries/sqlite
    gen:
      go:
        package: sqlitedb
        out: ../internal/store/sqlitedb
        emit_empty_slices: true
  - engine: postgresql
    schema: ../internal/store/migrations/postgres
    queries: queries/postgres
    gen:
      go:
        package: postgresdb
        out: ../internal/store/postgresdb
        emit_empty_slices: true
