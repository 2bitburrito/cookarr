name: Test
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: cookarr
          POSTGRES_PASSWORD: cookarr
          POSTGRES_DB: cookarr_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cookarr -d cookarr_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      COOKARR_TEST_POSTGRES_URL: postgres://cookarr:cookarr@localhost:5432/cookarr_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.30.0 generate -f db/sqlc.yaml
      - run: git diff --exit-code -- internal/store/sqlitedb internal/store/postgresdb
      - run: go vet ./...
      - run: go test -race ./...
