name: PR
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.30.0 generate -f db/sqlc.yaml
      - run: git diff --exit-code -- internal/store/sqlitedb internal/store/postgresdb
      - run: go vet ./...
      # Store tests start and stop their own Postgres container using Docker.
      - run: go test -race ./...
